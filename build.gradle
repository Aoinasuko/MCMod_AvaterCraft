plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '26.3-0.10.0'
group = 'dev.avatarcraft'
base { archivesName = 'bep_3davater_loader' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }
sourceSets {
    player {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    npc {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.npc.output + sourceSets.player.output
        runtimeClasspath += sourceSets.npc.output + sourceSets.player.output
    }
}
neoForge {
    version = '26.3.0.95'
    runs {
        client {
            client(); systemProperty 'avatarcraft.qa', 'true'
            if (System.getenv('AVATARCRAFT_QA_WORLD')) {
                programArgument '--quickPlaySingleplayer'
                programArgument System.getenv('AVATARCRAFT_QA_WORLD')
            }
        }
        server { server(); programArgument '--nogui' }
        playerGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run-player-qa')
            systemProperty 'avatarcraft.playerGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_player'
        }
        anchorClient {
            client()
            gameDirectory = file('run-anchor-ui-qa')
            systemProperty 'avatarcraft.qa', 'true'
            systemProperty 'avatarcraft.anchorUiQa', 'true'
            systemProperty 'avatarcraft.blueprintUiQa', providers.environmentVariable('AVATARCRAFT_BLUEPRINT_UI_QA').getOrElse('false')
            programArgument '--quickPlaySingleplayer'
            programArgument 'Anchor UI QA'
        }
        areaGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run-area-qa')
            systemProperty 'avatarcraft.npcGameTest', 'true'
            systemProperty 'avatarcraft.areaQa', 'true'
            systemProperty 'avatarcraft.areaLive', providers.environmentVariable('AVATARCRAFT_AREA_LIVE').getOrElse('false')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
        }
        anchorGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run-anchor-qa')
            systemProperty 'avatarcraft.npcGameTest', 'true'
            systemProperty 'avatarcraft.anchorQa', 'true'
            systemProperty 'avatarcraft.anchorLive', providers.environmentVariable('AVATARCRAFT_ANCHOR_LIVE').getOrElse('false')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
        }
        npcComplexGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run-npc-complex-qa')
            systemProperty 'avatarcraft.npcGameTest', 'true'
            systemProperty 'avatarcraft.complexQa', 'true'
            systemProperty 'avatarcraft.complexLive', providers.environmentVariable('AVATARCRAFT_COMPLEX_E2E').getOrElse('false')
            systemProperty 'avatarcraft.complexQaCases', providers.environmentVariable('AVATARCRAFT_COMPLEX_CASES').getOrElse('')
            systemProperty 'avatarcraft.complexControl', providers.environmentVariable('AVATARCRAFT_COMPLEX_CONTROL').getOrElse('false')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
        }
        npcGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run-npc-qa')
            systemProperty 'avatarcraft.npcGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
            if (System.getenv('AVATARCRAFT_NPC_TESTS')) {
                programArgument '--tests'
                programArgument System.getenv('AVATARCRAFT_NPC_TESTS')
            }
        }
        npcNaturalGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run-npc-natural-qa-' + providers.environmentVariable('AVATARCRAFT_NATURAL_SEED').getOrElse('61279'))
            systemProperty 'avatarcraft.npcGameTest', 'true'
            systemProperty 'avatarcraft.naturalQa', 'true'
            systemProperty 'avatarcraft.campaignQa', providers.environmentVariable('AVATARCRAFT_CAMPAIGN_QA').getOrElse('false')
            systemProperty 'avatarcraft.complexLive', providers.environmentVariable('AVATARCRAFT_NATURAL_LIVE').getOrElse('true')
            systemProperty 'avatarcraft.naturalSeed', providers.environmentVariable('AVATARCRAFT_NATURAL_SEED').getOrElse('61279')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
            programArgument '--packs'
            programArgument 'qa-packs'
        }
        npcWaterGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run-npc-water-qa/' + providers.environmentVariable('AVATARCRAFT_WATER_CASE').getOrElse('drops'))
            systemProperty 'avatarcraft.npcGameTest', 'true'
            systemProperty 'avatarcraft.waterQa', 'true'
            systemProperty 'avatarcraft.waterCase', providers.environmentVariable('AVATARCRAFT_WATER_CASE').getOrElse('drops')
            systemProperty 'avatarcraft.qaOutputRoot', file('build').absolutePath
            systemProperty 'avatarcraft.complexLive', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
        }
        npcTargetedGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run-npc-targeted-qa/' + providers.environmentVariable('AVATARCRAFT_NATURAL_SEED').getOrElse('61279') + '-' + providers.environmentVariable('AVATARCRAFT_TARGET_MISSION').getOrElse('coal'))
            systemProperty 'avatarcraft.npcGameTest', 'true'
            systemProperty 'avatarcraft.campaignQa', 'true'
            systemProperty 'avatarcraft.targetMission', providers.environmentVariable('AVATARCRAFT_TARGET_MISSION').getOrElse('coal')
            systemProperty 'avatarcraft.qaCommand', providers.environmentVariable('AVATARCRAFT_QA_COMMAND_OVERRIDE').getOrElse('')
            systemProperty 'avatarcraft.suppliedDiamondTools', providers.environmentVariable('AVATARCRAFT_QA_DIAMOND_TOOLS').getOrElse('false')
            systemProperty 'avatarcraft.qaPlanLimit', providers.environmentVariable('AVATARCRAFT_QA_PLAN_LIMIT').getOrElse('24')
            systemProperty 'avatarcraft.qaWallSeconds', providers.environmentVariable('AVATARCRAFT_QA_WALL_SECONDS').getOrElse('1500')
            systemProperty 'avatarcraft.qaRealTime', providers.environmentVariable('AVATARCRAFT_QA_REALTIME').getOrElse('false')
            systemProperty 'avatarcraft.qaOutputRoot', file('build').absolutePath
            systemProperty 'avatarcraft.complexLive', 'true'
            systemProperty 'avatarcraft.naturalSeed', providers.environmentVariable('AVATARCRAFT_NATURAL_SEED').getOrElse('61279')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
            programArgument '--packs'
            programArgument 'qa-packs'
        }
    }
    mods {
        bep_3davater_loader { sourceSet sourceSets.main }
        bep_3davater_player { sourceSet sourceSets.player }
        bep_3davater_companion { sourceSet sourceSets.npc }
    }
}
tasks.register('npcJar', Jar) {
    archiveBaseName = 'bep_3davater_companion'
    from sourceSets.npc.output
}
tasks.register('playerJar', Jar) {
    archiveBaseName = 'bep_3davater_player'
    from sourceSets.player.output
}
assemble.dependsOn tasks.named('npcJar'), tasks.named('playerJar')

tasks.register('prepareNpcNaturalWorld') {
    doLast {
        def seed = providers.environmentVariable('AVATARCRAFT_NATURAL_SEED').getOrElse('61279')
        def pack = file("run-npc-natural-qa-${seed}/qa-packs/npc-natural")
        pack.mkdirs()
        new File(pack, 'pack.mcmeta').text = groovy.json.JsonOutput.toJson([pack: [description: 'Isolated NPC natural terrain QA', min_format: 82, max_format: 999]])
        def preset = new File(pack, 'data/minecraft/worldgen/world_preset/flat_all_dimensions.json')
        preset.parentFile.mkdirs()
        def dims = [:]
        ['overworld', 'the_nether', 'the_end'].each { dimension ->
            def settings = dimension == 'the_nether' ? 'nether' : dimension == 'the_end' ? 'end' : 'overworld'
            dims["minecraft:${dimension}"] = [type: "minecraft:${dimension}", 'neoforge:seed_override': Long.parseLong(seed),
                generator: [type: 'minecraft:noise', settings: "minecraft:${settings}", biome_source:
                    dimension == 'the_end' ? [type: 'minecraft:the_end'] : [type: 'minecraft:multi_noise', preset: "minecraft:${settings}"]]]
        }
        preset.text = groovy.json.JsonOutput.toJson([dimensions: dims])
    }
}
tasks.matching { it.name == 'runNpcNaturalGameTest' }.configureEach { dependsOn 'prepareNpcNaturalWorld' }

tasks.register('prepareNpcTargetedWorld') {
    doLast {
        def seed = providers.environmentVariable('AVATARCRAFT_NATURAL_SEED').getOrElse('61279')
        def mission = providers.environmentVariable('AVATARCRAFT_TARGET_MISSION').getOrElse('coal')
        if (!(mission in ['logs', 'coal', 'farm', 'diamond', 'skeleton'])) throw new GradleException('Invalid targeted NPC mission')
        def pack = file("run-npc-targeted-qa/${seed}-${mission}/qa-packs/npc-natural")
        pack.mkdirs()
        new File(pack, 'pack.mcmeta').text = groovy.json.JsonOutput.toJson([pack: [description: 'Isolated NPC targeted natural QA', min_format: 82, max_format: 999]])
        def preset = new File(pack, 'data/minecraft/worldgen/world_preset/flat_all_dimensions.json')
        preset.parentFile.mkdirs()
        def dims = [:]
        ['overworld', 'the_nether', 'the_end'].each { dimension ->
            def settings = dimension == 'the_nether' ? 'nether' : dimension == 'the_end' ? 'end' : 'overworld'
            dims["minecraft:${dimension}"] = [type: "minecraft:${dimension}", 'neoforge:seed_override': Long.parseLong(seed),
                generator: [type: 'minecraft:noise', settings: "minecraft:${settings}", biome_source:
                    dimension == 'the_end' ? [type: 'minecraft:the_end'] : [type: 'minecraft:multi_noise', preset: "minecraft:${settings}"]]]
        }
        preset.text = groovy.json.JsonOutput.toJson([dimensions: dims])
    }
}
tasks.matching { it.name == 'runNpcTargetedGameTest' }.configureEach { dependsOn 'prepareNpcTargetedWorld' }

neoForge.runs {
    journalClient {
        client()
        gameDirectory = file('run-journal-client-qa')
        loadedMods = [neoForge.mods.bep_3davater_loader, neoForge.mods.bep_3davater_companion]
        systemProperty 'avatarcraft.journalUiQa', 'true'
        programArgument '--quickPlaySingleplayer'
        programArgument 'New World'
    }
    journalGameTest {
        type = 'gameTestServer'
        gameDirectory = file('run-journal-qa')
        loadedMods = [neoForge.mods.bep_3davater_loader, neoForge.mods.bep_3davater_companion]
        systemProperty 'avatarcraft.npcGameTest', 'true'
        systemProperty 'avatarcraft.journalQa', 'true'
        systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
    }
    aiSettingsClient {
        client()
        gameDirectory = file('run-ai-settings-client-qa')
        programArgument '--quickPlaySingleplayer'
        programArgument 'New World'
    }
    aiSettingsGameTest {
        type = 'gameTestServer'
        gameDirectory = file('run-ai-settings-qa')
        loadedMods = [neoForge.mods.bep_3davater_loader, neoForge.mods.bep_3davater_companion]
        systemProperty 'avatarcraft.npcGameTest', 'true'
        systemProperty 'avatarcraft.aiSettingsQa', 'true'
        systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_companion'
    }
    seriesClient {
        client()
        gameDirectory = file('run-series-client-qa')
        programArgument '--quickPlaySingleplayer'
        programArgument 'New World'
    }
    loaderClient {
        client()
        gameDirectory = file('run-loader-qa')
        loadedMods = [neoForge.mods.bep_3davater_loader]
    }
    playerClient {
        client()
        gameDirectory = file('run-player-client-qa')
        loadedMods = [neoForge.mods.bep_3davater_loader, neoForge.mods.bep_3davater_player]
    }
    companionClient {
        client()
        gameDirectory = file('run-companion-client-qa')
        loadedMods = [neoForge.mods.bep_3davater_loader, neoForge.mods.bep_3davater_companion]
    }
    loaderGameTest {
        type = 'gameTestServer'
        gameDirectory = file('run-loader-server-qa')
        loadedMods = [neoForge.mods.bep_3davater_loader]
        systemProperty 'avatarcraft.loaderGameTest', 'true'
        systemProperty 'neoforge.enabledGameTestNamespaces', 'bep_3davater_loader'
    }
    playerGameTest {
        loadedMods = [neoForge.mods.bep_3davater_loader, neoForge.mods.bep_3davater_player]
    }
    npcGameTest {
        loadedMods = [neoForge.mods.bep_3davater_loader, neoForge.mods.bep_3davater_companion]
    }
}
['loaderClient', 'playerClient', 'companionClient'].each { runName ->
    neoForge.runs.named(runName) {
        if (System.getenv('AVATARCRAFT_QA_WORLD')) {
            programArgument '--quickPlaySingleplayer'
            programArgument System.getenv('AVATARCRAFT_QA_WORLD')
        }
    }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.joml:joml:1.10.9'
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    def fixture = providers.environmentVariable('AVATARCRAFT_TEST_AVATAR').filter { !it.isBlank() }
    inputs.property('hasExportedAvatarFixture', fixture.isPresent())
    inputs.property('complexLive', providers.environmentVariable('AVATARCRAFT_COMPLEX_LIVE').getOrElse('0'))
    inputs.property('complexAuditCases', providers.environmentVariable('AVATARCRAFT_COMPLEX_CASES').getOrElse(''))
    inputs.property('codexLive', providers.environmentVariable('AVATARCRAFT_CODEX_LIVE').getOrElse('0'))
    if (fixture.isPresent()) {
        environment 'AVATARCRAFT_TEST_AVATAR', fixture.get()
        inputs.file(fixture.get()).withPropertyName('exportedAvatarFixture')
    }
}
