plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0'
group = 'dev.avatarcraft'
base { archivesName = 'avatarcraft' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }
neoForge {
    version = '26.3.0.95'
    runs { client { client(); systemProperty 'avatarcraft.qa', 'true' }; server { server(); programArgument '--nogui' } }
    mods { avatarcraft { sourceSet sourceSets.main } }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.joml:joml:1.10.9'
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
